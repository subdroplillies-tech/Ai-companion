<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic AI Companion with Images</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 0; display:flex; flex-direction:column; height:100vh; }
  #chat { flex:1; overflow-y:auto; padding:10px; background:#f5f5f5; }
  .message { margin:5px 0; }
  .user { text-align:right; color:blue; }
  .ai { text-align:left; color:green; }
  img.generated { max-width:100%; margin:5px 0; border-radius:5px; }
  #inputBox { display:flex; border-top:1px solid #ccc; }
  #input { flex:1; padding:10px; border:none; font-size:16px; }
  #send { padding:10px; background:#007bff; color:white; border:none; font-size:16px; cursor:pointer; }
</style>
</head>
<body>

<div id="chat"></div>

<div id="inputBox">
  <input type="text" id="input" placeholder="Type your message..." />
  <button id="send">Send</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const send = document.getElementById('send');

// Memory for conversation
let conversation = [
  { role: "system", content: `
You are a dynamic AI companion. You generate creative responses to all topics.
You can also generate images when the user requests by describing the image.
` }
];

// Display messages or images
function displayMessage(message, sender) {
  const div = document.createElement('div');
  div.className = 'message ' + sender;

  // Check if the message is an image URL
  if(message.startsWith('IMAGE:')) {
    const img = document.createElement('img');
    img.src = message.replace('IMAGE:', '').trim();
    img.className = 'generated';
    div.appendChild(img);
  } else {
    div.textContent = message;
  }

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// Send message to AI
async function sendMessage() {
  const userInput = input.value.trim();
  if (!userInput) return;

  displayMessage(userInput, 'user');
  input.value = '';

  // Check if user wants an image (example trigger: "draw" or "image of")
  if(userInput.toLowerCase().includes("draw") || userInput.toLowerCase().includes("image of")) {
    try {
      const imageResponse = await fetch('https://api.openai.com/v1/images/generations', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer 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'
        },
        body: JSON.stringify({
          prompt: userInput,
          n: 1,
          size: "512x512"
        })
      });

      const imageData = await imageResponse.json();
      const imageUrl = imageData.data[0].url;
      displayMessage('IMAGE:' + imageUrl, 'ai');

    } catch(err) {
      displayMessage("Error generating image: " + err.message, 'ai');
    }
  } else {
    // Regular AI chat
    conversation.push({ role: "user", content: userInput });

    try {
      const response = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer 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'
        },
        body: JSON.stringify({
          model: "gpt-4",
          messages: conversation
        })
      });

      const data = await response.json();
      const aiMessage = data.choices[0].message.content;
      displayMessage(aiMessage, 'ai');
      conversation.push({ role: "assistant", content: aiMessage });

    } catch(err) {
      displayMessage("Error: " + err.message, 'ai');
    }
  }
}

// Event listeners
send.addEventListener('click', sendMessage);
input.addEventListener('keypress', e => { if(e.key === 'Enter') sendMessage(); });

</script>
</body>
</html>
