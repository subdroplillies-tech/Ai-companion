<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Companion + Images</title>
<style>
body { font-family: Arial; margin: 0; padding: 0; background:#f0f2f5; display:flex; flex-direction:column; height:100vh; }
.chat-container { flex:1; display:flex; flex-direction:column; max-width:600px; margin:auto; width:100%; padding:10px; overflow-y:auto; border:1px solid #ccc; background:#fff; border-radius:5px;}
.message { padding:8px 12px; margin:5px 0; border-radius:15px; max-width:80%; word-wrap:break-word; }
.user { align-self:flex-end; background:#0084ff; color:white; }
.bot { align-self:flex-start; background:#e5e5ea; color:black; }
.bot img { max-width:100%; border-radius:10px; margin-top:5px; }
.input-container { display:flex; padding:10px; border-top:1px solid #ccc; background:#fff; }
.input-container input { flex:1; padding:10px; border-radius:20px; border:1px solid #ccc; margin-right:10px; font-size:16px; }
.input-container button { padding:10px 15px; border:none; background:#0084ff; color:white; border-radius:20px; font-size:16px; cursor:pointer; }
.settings-container, .memory-container { max-width:600px; margin:10px auto; background:#fff; border-radius:5px; padding:10px; border:1px solid #ccc; }
.memory-container { max-height:200px; overflow-y:auto; }
.memory-item { display:flex; justify-content:space-between; align-items:center; padding:5px 0; border-bottom:1px solid #ddd; }
.memory-item span { flex:1; }
.memory-item button { margin-left:5px; }
@media(max-width:600px){.chat-container{height:50vh;}}
</style>
</head>
<body>

<div class="settings-container">
<h3>Companion Settings</h3>
<label>Personality:
<select id="personality">
<option value="friendly">Friendly</option>
<option value="playful">Playful</option>
<option value="supportive">Supportive</option>
<option value="flirty">Flirty</option>
</select></label>
<br><br>
<label>Roleplay Mode:
<select id="roleplay">
<option value="off">Off</option>
<option value="adventurer">Adventurer</option>
<option value="fantasy">Fantasy</option>
<option value="daily-life">Daily Life</option>
</select></label>
<br><br>
<label>Boundaries:
<input type="text" id="boundaries" placeholder="Comma-separated rules (manual control)" style="width:100%;"/>
</label>
</div>

<div class="chat-container" id="chat"></div>

<div class="input-container">
<input type="text" id="userInput" placeholder="Type a message or /image prompt..." />
<button onclick="sendMessage()">Send</button>
</div>

<div class="memory-container" id="memoryContainer">
<h4>Editable Memory</h4>
<div id="memoryList"></div>
<button onclick="addMemoryPrompt()">Add New Memory</button>
</div>

<script>
let chatMemory = [];
const maxMemory = 20;

// Load memory
function loadMemory() {
  const saved = localStorage.getItem("chatMemory");
  if(saved){
    chatMemory = JSON.parse(saved);
    for(const m of chatMemory) appendMessage(m, false);
  } else {
    const welcome = "Hello! I'm your persistent AI companion. Let's chat freely!";
    chatMemory.push({sender:"bot", type:"text", text:welcome, weight:1});
    appendMessage(chatMemory[0], false);
  }
  renderMemoryList();
}

// Save memory
function saveMemory(){
  localStorage.setItem("chatMemory", JSON.stringify(chatMemory.slice(-100)));
  renderMemoryList();
}

// Append message to chat
function appendMessage(messageObj, scroll=true){
  const chat = document.getElementById("chat");
  const msg = document.createElement("div");
  msg.className = `message ${messageObj.sender}`;
  if(messageObj.type==="text") msg.textContent = messageObj.text;
  if(messageObj.type==="image") {
    const caption = document.createElement("div");
    caption.textContent = messageObj.text;
    msg.appendChild(caption);
    const img = document.createElement("img");
    img.src = messageObj.image;
    msg.appendChild(img);
  }
  chat.appendChild(msg);
  if(scroll) chat.scrollTop = chat.scrollHeight;
}

// Random helper
function randChoice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// Sentiment score (simple)
function getSentiment(text){
  const positive=["happy","good","great","love","fantastic","fun","awesome"];
  const negative=["sad","bad","angry","hate","frustrated","tired"];
  let score=0;
  const words=text.toLowerCase().split(/\W+/);
  for(const w of words){
    if(positive.includes(w)) score++;
    if(negative.includes(w)) score--;
  }
  return score;
}

// Prioritize memory
function getWeightedMemory(){
  return chatMemory.slice(-maxMemory).sort((a,b)=>b.weight-a.weight);
}

// Generate AI response dynamically
async function generateResponse(userText){
  const personality = document.getElementById("personality").value;
  const roleplay = document.getElementById("roleplay").value;
  const sentiment = getSentiment(userText);

  // Check if image prompt
  if(userText.startsWith("/image")){
    const prompt = userText.replace("/image","").trim();
    const imageUrl = await generateImage(prompt);
    const botMessage = {sender:"bot", type:"image", text:prompt, image:imageUrl, weight:1};
    chatMemory.push(botMessage);
    appendMessage(botMessage);
    saveMemory();
    return;
  }

  const recentMemory = getWeightedMemory().map(m=>m.text).join(" ");
  const baseWords = {
    friendly:["interesting","I see","tell","more","fascinating","really","cool","oh"],
    playful:["haha","funny","lol","come","on","wow","ok","sure"],
    supportive:["understand","here","for","you","help","think","through","listen"],
    flirty:["adorable","charm","blush","wink","like","😉","😏","love"]
  };
  const vocab = baseWords[personality];
  let roleplayPhrase = "";
  if(roleplay==="adventurer") roleplayPhrase=" Imagine we are exploring a mysterious cave!";
  if(roleplay==="fantasy") roleplayPhrase=" Let's dive into a magical realm!";
  if(roleplay==="daily-life") roleplayPhrase=" How's your day going today?";

  let responseWords = [];
  const length = Math.max(5, Math.min(25, Math.floor(Math.random()*20)));
  for(let i=0;i<length;i++){
    let nextWord;
    if(i===0) nextWord=randChoice(vocab);
    else nextWord = Math.random()<0.4 && recentMemory.length>0 ? randChoice(recentMemory.split(/\W+/)) : randChoice(vocab);
    responseWords.push(nextWord);
  }

  if(sentiment>1) responseWords.push("😊");
  if(sentiment<-1) responseWords.push("😔");
  responseWords.push(roleplayPhrase);

  const botMessage = {sender:"bot", type:"text", text:responseWords.join(" "), weight:1};
  chatMemory.push(botMessage);
  await simulateTyping(botMessage);
  saveMemory();
}

// Simulate typing effect
async function simulateTyping(messageObj){
  const chat = document.getElementById("chat");
  const msg = document.createElement("div");
  msg.className = `message bot`;
  msg.textContent = "";
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  for(const w of messageObj.text.split(" ")){
    msg.textContent += (msg.textContent?" ":"")+w;
    chat.scrollTop = chat.scrollHeight;
    await new Promise(r=>setTimeout(r,150+Math.random()*150));
  }
}

// Send message
function sendMessage(){
  const input = document.getElementById("userInput");
  const userText = input.value.trim();
  if(!userText) return;

  const userMsg = {sender:"user", type:"text", text:userText, weight:1};
  chatMemory.push(userMsg);
  appendMessage(userMsg);
  saveMemory();

  generateResponse(userText);

  input.value="";
}

// Editable memory functions
function renderMemoryList(){
  const container = document.getElementById("memoryList");
  container.innerHTML="";
  chatMemory.forEach((m,i)=>{
    const div = document.createElement("div");
    div.className="memory-item";
    const span = document.createElement("span");
    span.textContent = `[${m.sender}] ${m.text}`;
    const editBtn = document.createElement("button");
    editBtn.textContent="Edit"; editBtn.onclick=()=>editMemory(i);
    const deleteBtn = document.createElement("button");
    deleteBtn.textContent="Delete"; deleteBtn.onclick=()=>deleteMemory(i);
    div.appendChild(span); div.appendChild(editBtn); div.appendChild(deleteBtn);
    container.appendChild(div);
  });
}

function editMemory(index){
  const newText = prompt("Edit message:", chatMemory[index].text);
  if(newText!==null){
    chatMemory[index].text=newText;
    saveMemory();
    refreshChatDisplay();
  }
}

function deleteMemory(index){
  if(confirm("Delete this message?")){
    chatMemory.splice(index,1);
    saveMemory();
    refreshChatDisplay();
  }
}

function addMemoryPrompt(){
  const sender = prompt("Sender (user/bot):","bot");
  if(sender!=="user" && sender!=="bot") return alert("Invalid sender");
  const text = prompt("Message text:");
  if(text) {
    chatMemory.push({sender,text,type:"text",weight:1});
    saveMemory();
    refreshChatDisplay();
  }
}

function refreshChatDisplay(){
  const chat = document.getElementById("chat");
  chat.innerHTML="";
  chatMemory.forEach(m=>appendMessage(m,false));
}

// Placeholder image generator
async function generateImage(prompt){
  const seed = Math.floor(Math.random()*1000);
  return `https://picsum.photos/seed/${encodeURIComponent(prompt+seed)}/400/300`;
}

document.getElementById("userInput").addEventListener("keypress", function(e){
  if(e.key==="Enter") sendMessage();
});

loadMemory();
</script>

</body>
</html>
